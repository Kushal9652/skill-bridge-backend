<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - SkillBridge</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <nav>
    <div class="container">
      <div class="logo">SkillBridge</div>
      <ul class="nav-links"></ul>
    </div>
  </nav>

  <main>
    <section style="padding: 2rem 0;">
      <div class="container">
        <div class="flex-between mb-2">
          <h1 style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Student Dashboard</h1>
          <div id="user-info"></div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-3 mb-2">
          <div class="card text-center">
            <h3 style="font-size: 2.5rem; color: var(--primary-light);" id="total-applications">0</h3>
            <p class="text-muted">Total Applications</p>
          </div>
          <div class="card text-center">
            <h3 style="font-size: 2.5rem; color: var(--success-color);" id="approved-applications">0</h3>
            <p class="text-muted">Approved</p>
          </div>
          <div class="card text-center">
            <h3 style="font-size: 2.5rem; color: var(--warning-color);" id="pending-applications">0</h3>
            <p class="text-muted">Pending</p>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="card mb-2">
          <h2 class="mb-1">Quick Actions</h2>
          <div class="flex gap-1">
            <a href="/projects.html" class="btn btn-primary">Browse Projects</a>
            <a href="/profile.html" class="btn btn-outline">Edit Profile</a>
          </div>
        </div>

        <!-- My Applications -->
        <div class="card">
          <h2 class="mb-1">My Applications</h2>
          <div id="applications-container"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    // Ensure student is logged in
    if (!auth.requireRole('student')) {
      throw new Error('Access denied');
    }

    const user = auth.getUser();
    let applications = [];

    // Display user info
    document.getElementById('user-info').innerHTML = `
      <div style="text-align: right;">
        <p style="font-weight: 600; color: var(--text-primary);">${user.username}</p>
        <p class="text-muted" style="font-size: 0.875rem;">${user.email}</p>
      </div>
    `;

    async function loadApplications() {
      UI.showLoading();
      try {
        const response = await api.getStudentApplications();
        applications = response.data || response.applications || response;
        updateStats();
        renderApplications();
      } catch (error) {
        UI.showAlert('Failed to load applications', 'error');
      } finally {
        UI.hideLoading();
      }
    }

    function updateStats() {
      document.getElementById('total-applications').textContent = applications.length;
      document.getElementById('approved-applications').textContent = 
        applications.filter(app => app.status === 'approved').length;
      document.getElementById('pending-applications').textContent = 
        applications.filter(app => app.status === 'pending').length;
    }

    function renderApplications() {
      const container = document.getElementById('applications-container');
      
      if (applications.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">You haven\'t applied to any projects yet. <a href="/projects.html" style="color: var(--primary-light);">Browse projects</a></p>';
        return;
      }

      container.innerHTML = `
        <div class="grid grid-2">
          ${applications.map(app => `
            <div class="card">
              <div class="flex-between mb-1">
                <h3 style="color: var(--primary-light);">${app.projectId?.title || 'Project'}</h3>
                <span class="badge ${UI.getStatusBadgeClass(app.status)}">${app.status}</span>
              </div>
              <p class="text-muted mb-1">${UI.truncateText(app.projectId?.description || '', 100)}</p>
              <p class="text-muted" style="font-size: 0.875rem;">Applied: ${UI.formatDate(app.createdAt)}</p>
              <div class="flex gap-1 mt-1">
                <a href="/project-detail.html?id=${app.projectId?._id}" class="btn btn-primary">View Project</a>
                ${app.status === 'pending' ? `
                  <button class="btn btn-danger" onclick="deleteApplication('${app._id}')">Withdraw</button>
                ` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function deleteApplication(applicationId) {
      if (!confirm('Are you sure you want to withdraw this application?')) {
        return;
      }

      try {
        await api.deleteApplication(applicationId);
        UI.showAlert('Application withdrawn successfully', 'success');
        loadApplications();
      } catch (error) {
        UI.showAlert('Failed to withdraw application', 'error');
      }
    }

    // Initial load
    loadApplications();
  </script>
</body>
</html>
