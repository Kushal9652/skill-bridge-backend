<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillBridge</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <nav>
    <div class="container">
      <div class="logo">SkillBridge</div>
      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/projects.html">Projects</a></li>
        <li><a href="/login.html">Login</a></li>
        <li><a href="/register.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section style="padding: 4rem 0;">
      <div class="container">
        <div style="max-width: 500px; margin: 0 auto;">
          <div class="card">
            <h1 class="text-center mb-2" style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Welcome Back</h1>
            
            <form id="login-form">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <p class="text-center mt-1 text-muted">
              Don't have an account? <a href="/register.html" style="color: var(--primary-light); text-decoration: none;">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    // Redirect if already logged in
    if (auth.isAuthenticated()) {
      auth.redirectToDashboard();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      UI.showLoading();

      try {
        const result = await auth.login(email, password);
        
        if (result.success) {
          UI.showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            auth.redirectToDashboard();
          }, 1000);
        } else {
          UI.showAlert(result.error || 'Login failed', 'error');
        }
      } catch (error) {
        UI.showAlert('An error occurred during login', 'error');
      } finally {
        UI.hideLoading();
      }
    });
  </script>
</body>
</html>
